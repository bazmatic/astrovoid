name: Build Squiddler

# Builds the game on GitHub's own macOS and Windows machines (PyInstaller cannot cross-compile), checks that each
# starts, and puts both zips on a DRAFT release for you to publish. Run it from the Actions tab, or push a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15            # Apple Silicon
            archive: Squiddler-macos-arm64.zip
          - os: windows-latest
            archive: Squiddler-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Build
        run: python -m PyInstaller pyinstaller.spec --noconfirm
      - name: Start the macOS app headless
        if: runner.os == 'macOS'
        run: python tools/smoke_build.py dist/Squiddler.app/Contents/MacOS/Squiddler 12
      - name: Start the Windows build headless
        if: runner.os == 'Windows'
        run: python tools/smoke_build.py dist/Squiddler/Squiddler.exe 12
      - name: Zip the macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Squiddler.app "${{ matrix.archive }}"
      - name: Zip the Windows folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Squiddler -DestinationPath "${{ matrix.archive }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true
      - name: Draft a release with both builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then tag="build-${GITHUB_SHA::7}"; fi
          gh release create "$tag" builds/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Squiddler $tag" \
            --notes "Unsigned builds of ${GITHUB_SHA::7}. macOS: Apple Silicon only, drag Squiddler.app to Applications and right-click > Open the first time. Windows: unzip the whole folder and run Squiddler.exe; SmartScreen may ask you to confirm. No Python is needed on either."
